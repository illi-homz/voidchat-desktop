name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libssl-dev \
            libc++-dev

      - name: Install JS deps
        run: |
          npm install 2>&1
          npm install @rollup/rollup-linux-x64-gnu @esbuild/linux-x64 @tauri-apps/cli-linux-x64-gnu 2>&1

      - name: Build frontend
        run: npm run build 2>&1

      - name: Build Tauri app
        run: npm run tauri build 2>&1

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: voidchat-linux
          path: src-tauri/target/release/bundle/

  build-macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install JS dependencies
        run: npm install

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0"

      - name: Build frontend
        run: npm run build 2>&1

      - name: Build Tauri app
        run: npx tauri build 2>&1

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: voidchat-macos
          path: src-tauri/target/release/bundle/

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install JS dependencies
        run: npm install

      - name: Install JS deps
        run: |
          npm install 2>&1
          npm install @rollup/rollup-win32-x64-msvc @esbuild/win32-x64 @tauri-apps/cli-win32-x64-msvc 2>&1

      - name: Build frontend
        run: npm run build 2>&1

      - name: Build Tauri app
        run: npm run tauri build 2>&1

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: voidchat-windows
          path: src-tauri/target/release/bundle/

  create-release:
    name: Create Release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: List files
        run: find . -type f | head -50

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            voidchat-linux/**/*
            voidchat-macos/**/*
            voidchat-windows/**/*
          generate_release_notes: true
          fail_on_unmatched_files: false
          draft: true
